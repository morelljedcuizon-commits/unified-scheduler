name: Publish public website

on:
  workflow_dispatch:
    inputs:
      confirm_publication:
        description: 'I reviewed the policy and terms and approve publishing the website'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  prepare:
    if: inputs.confirm_publication
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
      - name: Check publication details
        shell: python
        run: |
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.request import Request, urlopen
          import re
          class DownloadLinks(HTMLParser):
              links = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == 'a' and 'data-release-download' in attrs:
                      self.links.append(attrs.get('href', ''))
          root = Path('docs/public-site')
          downloads = DownloadLinks()
          for name in ('index.html', 'privacy.html', 'terms.html'):
              page = (root / name).read_text(encoding='utf-8')
              downloads.feed(page)
              if 'data-publication-draft' in page or re.search(r'\{\{[A-Z_]+\}\}', page):
                  raise SystemExit(f'{name}: review publication details and remove the draft notice first; see docs/PUBLIC_SITE.md')
          for name in ('styles.css', '.nojekyll', 'assets/app-icon.ico', 'assets/today-demo.png', 'assets/calendar-demo.png'):
              if not (root / name).is_file():
                  raise SystemExit(f'Missing site asset: {name}')
          for url in set(downloads.links):
              if not url.startswith('https://github.com/morelljedcuizon-commits/unified-scheduler/releases/latest/download/'):
                  raise SystemExit('Unexpected installer download URL')
              try:
                  with urlopen(Request(url, method='HEAD'), timeout=30) as response:
                      if response.status != 200:
                          raise SystemExit('Installer download is not public yet')
              except Exception:
                  raise SystemExit('Publish the approved installer release before deploying its download button; see docs/RELEASE.md') from None
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs/public-site
  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy reviewed website
        id: deployment
        uses: actions/deploy-pages@v4
