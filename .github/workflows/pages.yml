name: Publish public website

on:
  workflow_dispatch:
    inputs:
      confirm_publication:
        description: 'I reviewed the policy and terms and approve publishing the website'
        type: boolean
        required: true
        default: false
      site_content_ref:
        description: 'Optional existing published commit for a verification-file-only update; leave empty for normal publication'
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  prepare:
    if: inputs.confirm_publication
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
      - name: Read the existing published website
        if: inputs.site_content_ref != ''
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.site_content_ref }}
          path: .pages-published
          persist-credentials: false
      - name: Check publication details
        shell: python
        env:
          SITE_CONTENT_REF: ${{ inputs.site_content_ref }}
        run: |
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.request import Request, urlopen
          import re
          import os
          import shutil
          class DownloadLinks(HTMLParser):
              links = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == 'a' and 'data-release-download' in attrs:
                      self.links.append(attrs.get('href', ''))
          source = Path('docs/public-site')
          root = Path('.pages-published/docs/public-site') if os.environ.get('SITE_CONTENT_REF') else source
          for verification in source.glob('google*.html'):
              if not re.fullmatch(r'google[0-9a-f]+\.html', verification.name):
                  raise SystemExit('Unexpected Google verification filename')
              if verification.read_text(encoding='utf-8').strip() != f'google-site-verification: {verification.name}':
                  raise SystemExit('Unexpected Google verification file contents')
              if root != source:
                  shutil.copyfile(verification, root / verification.name)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env_file:
              env_file.write(f'PUBLIC_SITE_DIRECTORY={root.as_posix()}\n')
          downloads = DownloadLinks()
          for name in ('index.html', 'privacy.html', 'terms.html'):
              page = (root / name).read_text(encoding='utf-8')
              downloads.feed(page)
              if 'data-publication-draft' in page or re.search(r'\{\{[A-Z_]+\}\}', page):
                  raise SystemExit(f'{name}: review publication details and remove the draft notice first; see docs/PUBLIC_SITE.md')
          for name in ('styles.css', '.nojekyll', 'assets/app-icon.ico', 'assets/today-demo.png', 'assets/calendar-demo.png'):
              if not (root / name).is_file():
                  raise SystemExit(f'Missing site asset: {name}')
          for url in set(downloads.links):
              if not url.startswith('https://github.com/morelljedcuizon-commits/unified-scheduler/releases/latest/download/'):
                  raise SystemExit('Unexpected installer download URL')
              try:
                  with urlopen(Request(url, method='HEAD'), timeout=30) as response:
                      if response.status != 200:
                          raise SystemExit('Installer download is not public yet')
              except Exception:
                  raise SystemExit('Publish the approved installer release before deploying its download button; see docs/RELEASE.md') from None
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ env.PUBLIC_SITE_DIRECTORY }}
  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy reviewed website
        id: deployment
        uses: actions/deploy-pages@v4
